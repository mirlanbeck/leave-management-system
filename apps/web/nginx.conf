server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Защитные заголовки (S9-f, DECISIONS 2026-10-31 10:33): на всех ответах, включая /api, SSE и ошибки (always).
  # add_header внутри location отменяет наследование этих строк, поэтому в location его не ставить.
  server_tokens off;
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # /api/x -> http://api:3000/x (префикс срезается; /health у API в корне)
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # под SSE (S8): без буферизации и с длинным таймаутом чтения
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
