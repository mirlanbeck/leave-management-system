name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Матрица TZ: по умолчанию (UTC на раннере) и America/New_York (ROADMAP, раздел 0).
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [default, America/New_York]
    name: unit (TZ ${{ matrix.tz }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - if: matrix.tz == 'default'
        run: npm test
      - if: matrix.tz != 'default'
        run: npm run test:tz

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [default, America/New_York]
    name: integration (TZ ${{ matrix.tz }})
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: leave
          POSTGRES_PASSWORD: leave
          POSTGRES_DB: leave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leave -d leave"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://leave:leave@127.0.0.1:5432/leave_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - if: matrix.tz == 'default'
        run: npm run test:int
      - if: matrix.tz != 'default'
        run: npx cross-env TZ=America/New_York npm run test:int
      # Сырой SQL миграции не должен расходиться со schema.prisma (БД уже мигрирована test:int)
      - if: matrix.tz == 'default'
        run: npm run db:drift -w apps/api

  # Падает на несуществующих §N и §N-k (RULES), плюс unit самого скрипта.
  trace-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:scripts
      - run: npm run trace-rules

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build --wait
      - run: npm run e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v

  # Чистый checkout без npm ci и .env: стек должен подняться одной командой (PDF п. 9).
  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - name: API /health = 200
        run: curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/health
      - name: web = 200 и /api/health через nginx
        run: |
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/api/health
      - name: вход seed-пользователем james (ROADMAP S0, S3)
        run: |
          curl -fsS -X POST http://127.0.0.1:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"login":"james","password":"demo1234"}' | grep -q accessToken
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
